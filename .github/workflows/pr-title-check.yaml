name: 'PR title check'
description: 'Validate pull request title against Conventional Commits'

# The total recommended execution time for the "CI/CD Pull Request" workflow is around 20 minutes.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

jobs:
  semantic-release-checks:
    name: 'Check semantic release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: 'Validate pull request title format'
        uses: ./.github/actions/check-pr-title
      - name: 'Predict next release version'
        id: version_check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          output=$(bash scripts/version-check.sh)
          echo "$output"

          current_version=$(echo "$output" | grep '^Current version:' | tail -1 | sed 's/^Current version: //')
          next_increment=$(echo "$output" | grep '^Next increment:' | tail -1 | sed 's/^Next increment: //')
          next_version=$(echo "$output" | grep '^Next version:' | tail -1 | sed 's/^Next version: //')

          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"
          echo "next_increment=$next_increment" >> "$GITHUB_OUTPUT"
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"

      - name: 'Show predicted release summary'
        run: |
          echo "Current=${{ steps.version_check.outputs.current_version }}, Increment=${{ steps.version_check.outputs.next_increment }}, Next=${{ steps.version_check.outputs.next_version }}"

      - name: 'Upsert prediction comment'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_VERSION: ${{ steps.version_check.outputs.current_version }}
          NEXT_INCREMENT: ${{ steps.version_check.outputs.next_increment }}
          NEXT_VERSION: ${{ steps.version_check.outputs.next_version }}
        run: |
          marker='<!-- release-prediction-comment -->'

          body=$(cat <<EOF
          ${marker}
          ## Release Prediction
          This repository follows semantic release versioning rules and squashes all commits in a pull request into a single commit.
          Based on the pull request title, the predicted release version is as follows:
          - Current version: ${CURRENT_VERSION}
          - Next increment: ${NEXT_INCREMENT}
          - Next version: ${NEXT_VERSION}
          EOF
          )

          comment_ids=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq ".[] | select(.body | contains(\"${marker}\")) | .id")

          if [[ -n "$comment_ids" ]]; then
            while IFS= read -r comment_id; do
              [[ -z "$comment_id" ]] && continue
              gh api -X DELETE "repos/${REPO}/issues/comments/${comment_id}"
            done <<< "$comment_ids"
          fi

          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
