name: 'CI/CD publish'

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  metadata:
    name: 'Set CI/CD metadata'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      build_datetime: ${{ steps.variables.outputs.build_datetime }}
      build_timestamp: ${{ steps.variables.outputs.build_timestamp }}
      build_epoch: ${{ steps.variables.outputs.build_epoch }}
      nodejs_version: ${{ steps.variables.outputs.nodejs_version }}
      python_version: ${{ steps.variables.outputs.python_version }}
      terraform_version: ${{ steps.variables.outputs.terraform_version }}
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: 'Set CI/CD variables'
        id: variables
        run: |
          datetime=$(date -u +'%Y-%m-%dT%H:%M:%S%z')
          echo "build_datetime=$datetime" >> $GITHUB_OUTPUT
          echo "build_timestamp=$(date --date=$datetime -u +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT
          echo "build_epoch=$(date --date=$datetime -u +'%s')" >> $GITHUB_OUTPUT
          echo "nodejs_version=$(grep "^nodejs" .tool-versions | cut -f2 -d' ')" >> $GITHUB_OUTPUT
          echo "python_version=$(grep "^python" .tool-versions | cut -f2 -d' ')" >> $GITHUB_OUTPUT
          echo "terraform_version=$(grep "^terraform" .tool-versions | cut -f2 -d' ')" >> $GITHUB_OUTPUT
      - name: 'List variables'
        run: |
          export BUILD_DATETIME="${{ steps.variables.outputs.build_datetime }}"
          export BUILD_TIMESTAMP="${{ steps.variables.outputs.build_timestamp }}"
          export BUILD_EPOCH="${{ steps.variables.outputs.build_epoch }}"
          export NODEJS_VERSION="${{ steps.variables.outputs.nodejs_version }}"
          export PYTHON_VERSION="${{ steps.variables.outputs.python_version }}"
          export TERRAFORM_VERSION="${{ steps.variables.outputs.terraform_version }}"
          make list-variables
  publish:
    name: 'Publish packages'
    runs-on: ubuntu-latest
    needs: [metadata]
    timeout-minutes: 3
    outputs:
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: '🔐 Generate app token'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 #v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.GH_VERSIONING_RELEASE_APP_ID || vars.NHS_GH_VERSIONING_RELEASE_APP_ID }}
          private-key: ${{ secrets.GH_VERSIONING_RELEASE_APP_PRIVATE_KEY || secrets.NHS_GH_VERSIONING_RELEASE_APP_PRIVATE_KEY }}

      - name: '🙈 Mask app token'
        run: echo "::add-mask::${{ steps.app-token.outputs.token }}"

      - name: '📦 Checkout repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: '🔑 Import and configure commit signing key'
        env:
          GIT_USER_NAME: ${{ vars.GIT_SIGNING_BOT_NAME || vars.NHS_GIT_SIGNING_BOT_NAME }}
          GIT_USER_EMAIL: ${{ vars.GIT_SIGNING_BOT_EMAIL || vars.NHS_GIT_SIGNING_BOT_EMAIL }}
          GPG_PKEY: ${{ secrets.GIT_SIGNING_BOT_GPG_PRIVATE_KEY || secrets.NHS_GIT_SIGNING_BOT_GPG_PRIVATE_KEY }}
          GPG_PASS: ${{ secrets.GIT_SIGNING_BOT_GPG_PASSPHRASE || secrets.NHS_GIT_SIGNING_BOT_GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          export GPG_TTY=$(tty)
          echo "$GPG_PKEY" | gpg --batch --import
          key_id=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          git config --global user.name "$GIT_USER_NAME"
          git config --global user.email "$GIT_USER_EMAIL"
          git config --global user.signingkey "$key_id"
          git config --global gpg.program gpg
          git config --global commit.gpgsign true
          if [ -n "$GPG_PASS" ]; then
            gpgconf --kill gpg-agent || true
            gpgconf --launch gpg-agent || true
            echo "warmup" | gpg --batch --yes --passphrase "$GPG_PASS" --pinentry-mode loopback --sign >/dev/null 2>&1 || true
          fi
          # Commit signature debug info
          gpg --list-secret-keys --keyid-format LONG
          git config --get user.name
          git config --get user.email
          gpg --fingerprint "$key_id"

      - name: 'Set up Node.js'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm
      - name: 'Install dependencies'
        run: npm ci
      - name: 'Build action bundle'
        run: npm run package

      - name: '🚀 Run release process'
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        id: semantic
        with:
          extra_plugins: |
            @semantic-release/git
            @semantic-release/github
            @semantic-release/exec
            conventional-changelog-conventionalcommits
            @semantic-release/changelog
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ vars.GIT_SIGNING_BOT_NAME || vars.NHS_GIT_SIGNING_BOT_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_SIGNING_BOT_EMAIL || vars.NHS_GIT_SIGNING_BOT_EMAIL }}
          GIT_COMMITTER_NAME: ${{ vars.GIT_SIGNING_BOT_NAME || vars.NHS_GIT_SIGNING_BOT_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.GIT_SIGNING_BOT_EMAIL || vars.NHS_GIT_SIGNING_BOT_EMAIL }}

      - name: 'Update major tag'
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: ./.github/actions/update-major-tag
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          full_release_version: ${{ steps.semantic.outputs.new_release_version }}
          major_release_version: ${{ steps.semantic.outputs.new_release_major_version }}

      - name: 'Output new release details'
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          echo ${{ steps.semantic.outputs.new_release_version }}
          echo ${{ steps.semantic.outputs.new_release_major_version }}
          echo ${{ steps.semantic.outputs.new_release_minor_version }}
          echo ${{ steps.semantic.outputs.new_release_patch_version }}
          export VERSION="${{ steps.semantic.outputs.new_release_version }}"
          make list-variables

  success:
    name: 'Success notification'
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - name: 'Check prerequisites for notification'
        id: check
        run: echo "secret_exist=${{ secrets.TEAMS_NOTIFICATION_WEBHOOK_URL != '' }}" >> $GITHUB_OUTPUT
      - name: 'Notify on publishing packages'
        if: steps.check.outputs.secret_exist == 'true'
        uses: nhs-england-tools/notify-msteams-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          teams-webhook-url: ${{ secrets.TEAMS_NOTIFICATION_WEBHOOK_URL }}
          message-title: 'nhs-england-tools/notify-msteams-action@v${{ needs.publish.outputs.version }}'
          message-text: 'A new version of this GitHub action has just been published.'
          link: ${{ github.repositoryUrl }}/releases/tag/v${{ needs.publish.outputs.version }}
