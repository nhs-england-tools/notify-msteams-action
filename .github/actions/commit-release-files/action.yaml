name: 'Commit the release files'
description: 'Use this action to commit the dist, changelog and package.json to the repo on main'
inputs:
  github_token:
    description: 'Token'
    required: true
  commit_message:
    description: 'The commit message to use when committing the release files'
    required: false
    default: 'chore(release)'
runs:
  using: 'composite'
  steps:
    - name: 'Mask GitHub token'
      shell: bash
      run: echo "::add-mask::${{ inputs.github_token }}"
    - name: 'Commit dist file'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        branch_name=${GITHUB_REF_NAME}
        repo_name_w_owner="${GITHUB_REPOSITORY}"
        commit_message="${{ inputs.commit_message }}"

        git add -f dist/ || true
        git add CHANGELOG.md || true
        git add package.json || true
        git add package-lock.json || true
        git add licenses.txt || true
        git add VERSION || true

        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        head_oid=$(git rev-parse HEAD)

        # Build the file changes JSON array
        tmp_changes=$(mktemp)
        echo '[]' > "$tmp_changes"
        while IFS= read -r file; do
          if [ -f "$file" ]; then
            tmp_b64=$(mktemp)
            base64 -w 0 < "$file" > "$tmp_b64"
            tmp_out=$(mktemp)
            jq --arg path "$file" --rawfile contents "$tmp_b64" '. + [{"path": $path, "contents": $contents}]' "$tmp_changes" > "$tmp_out"
            mv "$tmp_out" "$tmp_changes"
            rm -f "$tmp_b64"
          fi
        done < <(git diff --cached --name-only)

        # Build the complete GraphQL request body as a file to avoid passing large content through shell arguments
        tmp_request=$(mktemp)
        gql_query='mutation($githubRepository: String!, $branchName: String!, $headOid: GitObjectID!, $message: String!, $fileChanges: FileChanges!) {
            createCommitOnBranch(input: {
              branch: {
                repositoryNameWithOwner: $githubRepository
                branchName: $branchName
              }
              expectedHeadOid: $headOid
              message: {
                headline: $message
              }
              fileChanges: $fileChanges
            }) {
              commit {
                oid
                url
              }
            }
          }'

        jq -nc \
          --arg query "$gql_query" \
          --arg githubRepository "${repo_name_w_owner}" \
          --arg branchName "${branch_name}" \
          --arg headOid "${head_oid}" \
          --arg message "${commit_message}" \
          --slurpfile additions "$tmp_changes" \
          '{
            query: $query,
            variables: {
              githubRepository: $githubRepository,
              branchName: $branchName,
              headOid: $headOid,
              message: $message,
              fileChanges: { additions: $additions[0] }
            }
          }' > "$tmp_request"

        rm -f "$tmp_changes"

        # Single GraphQL mutation to create the commit and update the branch
        gh api graphql --input "$tmp_request"

        rm -f "$tmp_request"
