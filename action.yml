name: 'Notify MS Teams'
description: 'GitHub Action to notify an MS Teams channel'
author: 'Chris Walters'
inputs:
  github-token:
    required: true
    description: 'GitHub token'
  teams-webhook-url:
    required: true
    description: 'URL for the incoming webhook in your target channel'
  message-title:
    required: true
    description: 'The title for the message'
    default: 'GitHub Action Notification'
  message-text:
    required: true
    description: 'The content of the message to be displayed'
  message-colour:
    required: false
    description: 'The colour of the title: default, accent, good, warning or attention. Other values use default'
  link:
    required: false
    description: 'A link to include in the message'
  link-title:
    required: false
    description: 'The text of the link button'
    default: 'View'
  facts:
    required: false
    description: 'Extra facts to show after the run details, one "Name: value" pair per line'
  commit:
    required: false
    description: 'The commit SHA or tag whose author is shown, the commit that triggered the run by default'
runs:
  using: 'node24'
  main: 'dist/index.js'
